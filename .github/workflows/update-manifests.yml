name: Update Homebrew and Scoop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to update or retry
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: package-manifests
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download installers and update both manifests
        id: manifests
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_manifests.py

      - name: Commit and push validated manifests
        if: ${{ steps.manifests.outputs.changed == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.manifests.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/capsdeck.rb bucket/capsdeck.json
          git commit -m "chore: update CapsDeck to $RELEASE_TAG"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          git fetch origin "$DEFAULT_BRANCH"
          git diff --exit-code HEAD "origin/$DEFAULT_BRANCH" -- Casks/capsdeck.rb bucket/capsdeck.json

      - name: Update summary
        env:
          STATUS: ${{ steps.manifests.outputs.status }}
          RELEASE_TAG: ${{ steps.manifests.outputs.tag }}
        run: echo "$RELEASE_TAG - $STATUS" >> "$GITHUB_STEP_SUMMARY"
